[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webmcp-instrumenter"
version = "0.1.0"
description = "Spec-driven tool to instrument test sites with WebMCP tools and measure real agent-invocation volume (Experiment B)."
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.48",
    "anthropic>=0.40",
    "jsonschema>=4.23",
    "httpx>=0.27",
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
webmcp-instrument = "webmcp_instrumenter.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/webmcp_instrumenter"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
