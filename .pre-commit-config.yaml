# Static-analysis gate. Runs on `git commit` (fast checks) and `git push` (tests).
# One-time setup: `pre-commit install && pre-commit install --hook-type pre-push`
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff            # lint (auto-fixes what it safely can)
        args: [--fix]
      - id: ruff-format     # formatter

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files

  # mypy + pytest run in THIS project's venv so they see the installed deps.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (type check)
        entry: .venv/bin/mypy
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
      - id: pytest
        name: pytest (pre-push)
        entry: .venv/bin/python -m pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
